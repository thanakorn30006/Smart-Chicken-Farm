# Mosquitto 2.x for Smart Chicken Farm
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# One listener for gateways and Node-RED. Browsers never connect to the broker:
# they get live data from Node-RED's WebSocket after logging in.
listener 1883
protocol mqtt

# ---- security ----
# (Mosquitto 2 does not allow comments at the end of a setting line: keep them on their own line)
# every client needs a username + password
allow_anonymous false
# nodered + one account per gateway (hashed by mosquitto_passwd)
password_file /mosquitto/auth/passwd
# each gateway may only use scf/<its own username>/...
acl_file /mosquitto/config/acl
# sensor messages are tiny; refuse anything big
max_packet_size 4096
