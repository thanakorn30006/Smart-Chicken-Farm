<aside class="side" id="side"></aside>
<div class="content">
<main>
  <div class="title"><div><h2>รุ่นไก่และเวลาไฟ</h2><span>ลงไก่รุ่นใหม่ จบรุ่น และตั้งเวลาไฟของแต่ละโรงเรือน</span></div></div>
  <div id="coopsSettings" class="settings"></div>
  <div class="panel ref">
    <div class="panel-head"><h3>เป้าหมายอุณหภูมิตามอายุไก่เนื้อ</h3><span class="hint">ระบบใช้ตารางนี้ปรับเกณฑ์แจ้งเตือนให้เองทุกวัน (ยอมรับได้ ±3 °C)</span></div>
    <div class="ref-row">
      <div><b>32°</b><span>วันแรก</span></div><div><b>29°</b><span>7 วัน</span></div><div><b>27°</b><span>14 วัน</span></div>
      <div><b>25°</b><span>21 วัน</span></div><div><b>23°</b><span>28 วัน</span></div><div><b>21°</b><span>35 วัน</span></div><div><b>20°</b><span>42 วัน+</span></div>
    </div>
    <p class="hint">ความชื้นที่เหมาะสม: สัปดาห์แรก 60–70 % หลังจากนั้น 50–70 %</p>
  </div>
</main>
