<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ · Smart Chicken Farm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d71f26'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle'%3E%F0%9F%90%94%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body class="page-login">
<main class="login-wrap">
  <form class="panel login-card form" id="loginForm" novalidate>
    <div class="login-brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 7.5C9 5 10.8 3.5 13 3.5S17 5 17 7.5c0 1-.3 1.8-.8 2.5 2.2.8 3.8 2.9 3.8 5.5a5.5 5.5 0 0 1-5.5 5.5h-3A5.5 5.5 0 0 1 6 15.5c0-2.2 1.2-4 3-5"/>
        <path d="M17 6.5l2.5-.5-2 2M12 21v-2M15 21v-2M13.2 7h.01"/></svg></div>
      <div><h1>Smart Chicken Farm</h1><p>ระบบจัดการฟาร์มไก่</p></div>
    </div>
    <h2>เข้าสู่ระบบ</h2>
    <p class="notice" id="notice" hidden></p>
    <label>ชื่อผู้ใช้<input name="username" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="32"></label>
    <label>รหัสผ่าน<input name="password" id="password" type="password" autocomplete="current-password" required maxlength="128"></label>
    <p class="form-error" id="err" role="alert" hidden></p>
    <button class="btn primary block" type="submit" id="go">เข้าสู่ระบบ</button>
    <p class="hint center">ลืมรหัสผ่าน? ติดต่อผู้ดูแลระบบให้รีเซ็ตให้</p>
    <p class="secure-note"><i data-ic="shield"></i>รหัสผ่าน + ยืนยันตัวตน 2 ขั้นด้วยแอป · ผิด 5 ครั้งล็อก 5 นาที</p>
  </form>
  <form class="panel login-card form" id="mfaForm" novalidate hidden></form>
</main>
<script type="module" src="js/pages/login.js"></script>
</body>
</html>
